name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android_app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT=${GITHUB_SHA::7}
          NAME="OpenRadiaCode-v${VERSION}-${SHORT}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=android_app/$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      # Rolling pre-release so the latest APK is downloadable from a phone
      # without logging into GitHub Actions or unzipping an artifact.
      - name: Publish rolling pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic debug build from commit ${GITHUB_SHA}."
